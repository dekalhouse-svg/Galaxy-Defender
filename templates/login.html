<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion admin — Galaxy Defender</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b20;color:#fff;font-family:system-ui;padding:20px}.box{width:min(100%,380px);padding:28px;border:1px solid #38527e;border-radius:22px;background:#101b3a;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:24px}p{color:#aabce2;font-size:13px}label{display:block;margin:15px 0 6px;font-size:13px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #40547b;background:#08122d;color:white}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:linear-gradient(90deg,#57eaff,#6ea7ff);font-weight:900;color:#07152b}.err{color:#ff8a9b}
</style></head><body><form class="box" method="post"><h1>GALAXY DEFENDER</h1><p>Administration sécurisée</p>{% if error %}<p class="err">{{error}}</p>{% endif %}<label>Identifiant</label><input name="username" autocomplete="username" required><label>Mot de passe</label><input type="password" name="password" autocomplete="current-password" required><button>SE CONNECTER</button></form></body></html>
