<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080b20">
<meta name="description" content="Galaxy Defender, jeu spatial arcade par DEKAL HOUSE.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<title>Galaxy Defender — by DEKAL HOUSE</title>
<style>
:root{color-scheme:dark;--cyan:#54eaff;--gold:#ffd65a;--panel:rgba(10,17,43,.82)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050716;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100vw;height:100dvh;max-width:520px;overflow:hidden;background:#080b20;isolation:isolate;padding-bottom:68px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:3;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;gap:9px;pointer-events:none}
.pill{height:43px;min-width:77px;padding:0 12px;border:1px solid rgba(156,203,255,.3);border-radius:14px;background:linear-gradient(180deg,rgba(19,31,65,.92),rgba(7,12,32,.88));box-shadow:0 5px 18px #0005,inset 0 1px #ffffff12;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.3px}
.pill .icon{font-size:18px;filter:drop-shadow(0 0 5px currentColor)}
#scoreBox{flex:1}
#pauseBtn{pointer-events:auto;width:45px;min-width:45px;height:43px;border:1px solid rgba(84,234,255,.45);border-radius:14px;color:var(--cyan);background:rgba(7,22,51,.9);font-size:19px;font-weight:900}
.brand{position:absolute;z-index:2;top:65px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:3px;color:#8aa8df88;font-weight:800;pointer-events:none}
.overlay{position:absolute;z-index:5;inset:0 0 68px;display:flex;align-items:center;justify-content:center;padding:28px;background:linear-gradient(180deg,rgba(3,6,20,.48),rgba(3,6,20,.78));backdrop-filter:blur(5px)}
.card{width:min(100%,350px);text-align:center;padding:27px 22px 23px;border:1px solid rgba(115,208,255,.28);border-radius:26px;background:linear-gradient(150deg,rgba(17,31,69,.96),rgba(7,11,31,.97));box-shadow:0 20px 70px #0009,inset 0 1px #fff1}
.logo{width:84px;height:84px;margin:0 auto 14px;filter:drop-shadow(0 0 18px #28cfff66)}
h1{margin:0;font-size:27px;letter-spacing:1px;line-height:1.1}
.subtitle{margin:10px 0 21px;color:#aabce2;font-size:13px;line-height:1.6}
.primary,.secondary{width:100%;border:0;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:900;letter-spacing:.5px}
.primary{color:#061124;background:linear-gradient(100deg,#57eaff,#6ea7ff);box-shadow:0 7px 22px #31bfff30}
.secondary{margin-top:10px;color:#dbe8ff;background:#ffffff0c;border:1px solid #ffffff1c}
.small{font-size:11px;color:#7185b1;margin-top:17px;letter-spacing:1px}
.hidden{display:none!important}
#controls{position:absolute;z-index:4;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));height:92px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;pointer-events:none}
.ctrl{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:1px solid #8bcfff66;background:linear-gradient(145deg,#19305bba,#080f2aba);color:#d9f8ff;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:inset 0 0 18px #4acfff12,0 6px 22px #0005;user-select:none}
.ctrl:active{background:#28618b99;transform:scale(.96)}
#fireBtn{width:82px;height:82px;color:#fff;background:conic-gradient(#5cf4ff calc(var(--charge,0)*1%),#ffffff20 0);border:1px solid #8cf7ff99;box-shadow:0 0 24px #28dfff3d;position:relative;font-size:25px}
#fireBtn::before{content:'⚡';position:absolute;inset:5px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#245b83,#101b43 72%);font-size:27px}
#fireBtn.ready{box-shadow:0 0 25px #5cf4ff99,0 0 45px #5cf4ff55;animation:readyPulse .8s infinite alternate}
@keyframes readyPulse{to{transform:scale(1.07);filter:brightness(1.3)}}
#adBanner{position:absolute;z-index:8;left:0;right:0;bottom:0;height:68px;background:#fff;color:#172033;display:flex;align-items:center;justify-content:center;overflow:hidden;border-top:1px solid #d7dce5;font-family:Arial,sans-serif}
#adBanner a{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-decoration:none;color:inherit;background:#fff}
#adBanner img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
#adBanner [hidden]{display:none!important}
#adFallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#fff;color:#172033;font-size:12px;font-weight:800;letter-spacing:1px}
#adLabel{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:5px 9px;border-radius:12px;background:#f47716;color:#fff;font-size:10px;font-weight:800;letter-spacing:.4px;pointer-events:none}

#tip{position:absolute;z-index:2;bottom:calc(176px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:10px;letter-spacing:1.5px;color:#91b7e588;pointer-events:none}
#toast{position:absolute;z-index:4;top:110px;left:0;right:0;text-align:center;color:#7ef5ff;font-weight:900;letter-spacing:2px;font-size:12px;text-shadow:0 0 15px #00cfff;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media(min-width:600px){#game{height:min(100dvh,940px);width:min(100vw,460px);border-left:1px solid #26315b;border-right:1px solid #26315b}}
</style>
</head>
<body>
<div id="game">
  <canvas id="screen" aria-label="Jeu de tir spatial"></canvas>
  <div class="hud">
    <div class="pill"><span class="icon" style="color:#ff5474">♥</span><span id="lives">3</span></div>
    <div class="pill" id="scoreBox"><span class="icon" style="color:#ffd65a">★</span><span id="score">0</span></div>
    <button id="pauseBtn" aria-label="Pause">Ⅱ</button>
  </div>
  <div class="brand">GALAXY DEFENDER</div>
  <div id="toast"></div>
  <div id="tip">GLISSE TON DOIGT POUR BOUGER</div>
  <div id="controls">
    <button class="ctrl" id="leftBtn" aria-label="Gauche">‹</button>
    <button class="ctrl" id="fireBtn" aria-label="Méga arme, chargement 8 secondes" title="Méga arme"> </button>
    <button class="ctrl" id="rightBtn" aria-label="Droite">›</button>
  </div>
  <div class="overlay" id="menu">
    <div class="card">
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
        <defs><linearGradient id="shipg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7ffff"/><stop offset=".45" stop-color="#61dfff"/><stop offset="1" stop-color="#4b69e8"/></linearGradient></defs>
        <path d="M50 5 L64 38 L88 57 L72 66 L66 52 L61 80 L50 94 L39 80 L34 52 L28 66 L12 57 L36 38 Z" fill="url(#shipg)" stroke="#fff" stroke-width="2"/>
        <path d="M50 25 L57 55 L50 64 L43 55 Z" fill="#173e83"/><path d="M44 80 L50 96 L56 80" fill="#ff8a4c"/>
        <circle cx="50" cy="44" r="5" fill="#72ffff"/>
      </svg>
      <h1>GALAXY<br>DEFENDER</h1>
      <p class="subtitle">Protège la galaxie. Détruis les escadrons ennemis et bats ton record.</p>
      <button class="primary" id="startBtn">JOUER</button>
      <button class="secondary" id="soundBtn">SON : ACTIVÉ</button>
      <div class="small">BY DEKAL HOUSE</div>
    </div>
  </div>
  <div class="overlay hidden" id="pauseMenu">
    <div class="card"><h1>PAUSE</h1><p class="subtitle">La galaxie attend ton retour.</p><button class="primary" id="resumeBtn">REPRENDRE</button><button class="secondary" id="restartBtn">RECOMMENCER</button></div>
  </div>
  <div class="overlay hidden" id="overMenu">
    <div class="card"><h1>MISSION TERMINÉE</h1><p class="subtitle" id="finalScore">Score : 0</p><button class="primary" id="againBtn">REJOUER</button><button class="secondary" id="homeBtn">MENU PRINCIPAL</button><div class="small" id="bestText"></div></div>
  </div>
</div>
  <div id="adBanner" aria-label="Publicité">
    <a id="adLink" href="#" target="_blank" rel="noopener">
      <img id="adImage" alt="Publicité" hidden>
      <span id="adFallback">PUBLICITÉ</span>
      <span id="adLabel">PUBLICITÉ</span>
    </a>
  </div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const ui = {
  lives:$('lives'), score:$('score'), menu:$('menu'), pause:$('pauseMenu'),
  over:$('overMenu'), toast:$('toast'), pauseBtn:$('pauseBtn')
};
let W=0,H=0,DPR=1, running=false, paused=false, gameOver=false;
let score=0, lives=3, best=Number(localStorage.getItem('galaxyDefenderBest')||0);
let last=0, elapsed=0, spawnTimer=0, fireTimer=0, shake=0, power=0, soundOn=true, audioCtx=null, megaCharge=0, megaReady=false, megaFlash=0, playSessionId=null;
let stars=[], bullets=[], enemyBullets=[], enemies=[], particles=[], powerups=[];
let keys={left:false,right:false,fire:true}, pointerDown=false, pointerX=null, toastTimer=0;
const player={x:0,y:0,w:44,h:58,speed:300,invuln:0,weapon:1};
const rand=(a,b)=>Math.random()*(b-a)+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function resize(){
  const r=$('game').getBoundingClientRect(); DPR=Math.min(window.devicePixelRatio||1,2);
  W=r.width; H=r.height; canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  player.y=H*.79; player.x=clamp(player.x||W/2,28,W-28);
  stars=Array.from({length:Math.max(65,Math.floor(W*H/4200))},()=>({x:Math.random()*W,y:Math.random()*H,z:rand(.3,1),r:rand(.45,1.65),tw:rand(0,6)}));
}
window.addEventListener('resize',resize); resize();

function sound(freq=500,duration=.07,type='sine',vol=.12){
 if(!soundOn)return;
 try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume();
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(Math.min(.7,vol*2.2),audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);}catch(e){}
}

function updateMegaButton(){
  const button=$('fireBtn');
  if(!button)return;
  button.style.setProperty('--charge',String(Math.round(megaCharge/8*100)));
  button.classList.toggle('ready',megaReady);
  button.setAttribute('aria-label',megaReady?'Méga arme prête':'Méga arme, chargement '+Math.ceil(8-megaCharge)+' secondes');
  button.title=megaReady?'Méga arme prête !':'Charge : '+Math.floor(megaCharge/8*100)+'%';
}
function useMegaWeapon(){
  if(!running||paused)return;
  if(!megaReady){notify('MÉGA ARME EN CHARGEMENT');return}
  megaReady=false;megaCharge=0;megaFlash=.42;
  enemyBullets.forEach(b=>addExplosion(b.x,b.y,'#68f7ff',7));
  enemyBullets=[];
  for(let i=enemies.length-1;i>=0;i--){
    const enemy=enemies[i];
    enemy.hp-=enemy.big?2:99;
    addExplosion(enemy.x,enemy.y,'#75f7ff',enemy.big?18:24);
    if(enemy.hp<=0){score+=enemy.big?80:25;enemies.splice(i,1)}
  }
  ui.score.textContent=score;shake=13;notify('MÉGA DÉCHARGE !');
  sound(95,.42,'sawtooth',.19);sound(880,.22,'triangle',.1);
  updateMegaButton();
}
async function startTrackedSession(){
  try{
    let uid=localStorage.getItem('galaxyDefenderUser');
    if(!uid){
      uid=(crypto.randomUUID?crypto.randomUUID():('u'+Date.now()+Math.random().toString(16).slice(2)));
      localStorage.setItem('galaxyDefenderUser',uid);
    }
    const response=await fetch('/api/session/start',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:uid})
    });
    if(response.ok){const data=await response.json();playSessionId=data.session_id}
  }catch(error){console.warn('Statistiques indisponibles hors connexion',error)}
}
function endTrackedSession(){
  if(!playSessionId)return;
  const payload=JSON.stringify({session_id:playSessionId});
  try{navigator.sendBeacon('/api/session/end',new Blob([payload],{type:'application/json'}))}catch(error){}
  playSessionId=null;
}
async function loadAdvertisement(){
  const image=$('adImage');
  const fallback=$('adFallback');
  const link=$('adLink');
  const storageKey='galaxyDefenderCachedAd';
  const userId=localStorage.getItem('galaxyDefenderUser')||'';

  function displayAd(ad,imageUrl){
    link.href=ad.id
      ? '/api/ads/'+ad.id+'/click?uid='+encodeURIComponent(userId)
      : (ad.link_url||'#');
    image.alt=ad.title||'Publicité';
    image.onload=()=>{image.hidden=false;fallback.hidden=true};
    image.onerror=()=>{image.hidden=true;fallback.hidden=false};
    image.hidden=false;
    image.src=imageUrl;
  }

  try{
    // En ligne : récupérer la publicité actuelle et télécharger son image.
    const response=await fetch('/api/ads/active',{cache:'no-store'});
    if(!response.ok)throw new Error('API publicité : '+response.status);
    const ad=await response.json();
    if(!ad||!ad.id||!ad.image_url)throw new Error('Aucune publicité active');

    const imageUrl=new URL(ad.image_url,window.location.origin).href;
    let imageCached=false;
    try{
      const imageResponse=await fetch(imageUrl,{cache:'no-store'});
      if(imageResponse.ok){
        const cache=await caches.open('galaxy-defender-ads-v1');
        await cache.put(imageUrl,imageResponse.clone());
        imageCached=true;
      }
    }catch(error){console.warn('Téléchargement de la publicité impossible',error)}

    // On conserve les informations nécessaires pour retrouver la publicité hors ligne.
    if(imageCached){
      localStorage.setItem(storageKey,JSON.stringify({
        id:ad.id,title:ad.title||'Publicité',image_url:imageUrl,link_url:ad.link_url||''
      }));
    }
    displayAd(ad,imageUrl);

    fetch('/api/ads/'+ad.id+'/impression',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:userId})
    }).catch(()=>{});
  }catch(error){
    // Hors ligne : reprendre la dernière publicité et son image téléchargée.
    try{
      const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
      if(!saved||!saved.image_url)throw new Error('Aucune publicité enregistrée');
      const cache=await caches.open('galaxy-defender-ads-v1');
      const cachedImage=await cache.match(saved.image_url);
      if(!cachedImage)throw new Error('Image publicitaire absente du cache');
      const blob=await cachedImage.blob();
      const objectUrl=URL.createObjectURL(blob);
      displayAd(saved,objectUrl);
    }catch(offlineError){
      image.hidden=true;
      fallback.hidden=false;
      console.warn('Aucune publicité disponible hors ligne',offlineError);
    }
  }
}

function notify(msg){ui.toast.textContent=msg;ui.toast.classList.add('show');toastTimer=1.3}
function resetGame(){
 endTrackedSession();
 score=0;lives=3;elapsed=0;spawnTimer=.5;fireTimer=0;shake=0;power=0;megaCharge=0;megaReady=false;megaFlash=0;updateMegaButton();player.weapon=1;player.x=W/2;player.y=H*.79;player.invuln=1.5;
 bullets=[];enemyBullets=[];enemies=[];particles=[];powerups=[];gameOver=false;paused=false;running=true;
 ui.score.textContent='0';ui.lives.textContent='3';ui.menu.classList.add('hidden');ui.pause.classList.add('hidden');ui.over.classList.add('hidden');ui.pauseBtn.textContent='Ⅱ';
 notify('MISSION LANCÉE');startTrackedSession();last=performance.now();requestAnimationFrame(loop);
}
function pauseGame(){if(!running||gameOver)return;paused=true;ui.pause.classList.remove('hidden')}
function resumeGame(){paused=false;ui.pause.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function endGame(){
 running=false;gameOver=true;endTrackedSession();
 if(score>best){best=score;localStorage.setItem('galaxyDefenderBest',String(best))}
 $('finalScore').textContent='Score : '+score;
 $('bestText').textContent='MEILLEUR SCORE : '+best;
 ui.over.classList.remove('hidden');sound(130,.35,'sawtooth',.06);
}
function addExplosion(x,y,color='#ff9d55',count=20){
 for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(35,230);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.7),max:.7,r:rand(1.3,3.7),color})}
}
function shoot(){
 const spread=player.weapon>=3?[-.22,0,.22]:player.weapon===2?[-.12,.12]:[0];
 spread.forEach(a=>bullets.push({x:player.x+Math.sin(a)*15,y:player.y-25,vx:Math.sin(a)*65,vy:-590, r:player.weapon>=3?3.2:2.7, damage:1}));
 sound(760,.045,'square',.012);
}
function spawnEnemy(){
 const big=Math.random()<Math.min(.25,.07+elapsed/180);
 const size=big?30:rand(17,23);
 enemies.push({x:rand(size+8,W-size-8),y:-size-5,w:size*1.25,h:size*1.35,hp:big?3:1,maxHp:big?3:1,speed:rand(65,105)+Math.min(85,elapsed*1.1),vx:rand(-24,24),phase:rand(0,6),fire:rand(1.3,3.5),big,kind:Math.floor(rand(0,3))});
}
function update(dt){
 elapsed+=dt;spawnTimer-=dt;fireTimer-=dt;if(!megaReady){megaCharge=Math.min(8,megaCharge+dt);if(megaCharge>=8){megaReady=true;notify('MÉGA ARME CHARGÉE !');sound(980,.16,'sine',.08)}updateMegaButton()}megaFlash=Math.max(0,megaFlash-dt);player.invuln=Math.max(0,player.invuln-dt);power=Math.max(0,power-dt);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)ui.toast.classList.remove('show')}
 if(keys.left)player.x-=player.speed*dt;if(keys.right)player.x+=player.speed*dt;
 if(pointerX!==null)player.x+=(pointerX-player.x)*Math.min(1,dt*12);
 player.x=clamp(player.x,25,W-25);
 if(fireTimer<=0){shoot();fireTimer=power>0?.12:.24}
 if(spawnTimer<=0){spawnEnemy();spawnTimer=Math.max(.32,1.05-elapsed*.006)*rand(.72,1.22)}
 stars.forEach(s=>{s.y+=(30+s.z*100)*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}s.tw+=dt});
 bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});bullets=bullets.filter(b=>b.y>-20);
 enemyBullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});enemyBullets=enemyBullets.filter(b=>b.y<H+20);
 // Collision entre un laser du joueur et un missile ennemi :
 // les deux projectiles disparaissent et produisent une petite étincelle.
 for(let i=bullets.length-1;i>=0;i--){
  const friendly=bullets[i];
  let intercepted=false;
  for(let j=enemyBullets.length-1;j>=0;j--){
   const hostile=enemyBullets[j];
   const dx=friendly.x-hostile.x, dy=friendly.y-hostile.y;
   const hitRadius=(friendly.r||3)+(hostile.r||4)+2;
   if(dx*dx+dy*dy<=hitRadius*hitRadius){
    bullets.splice(i,1);
    enemyBullets.splice(j,1);
    addExplosion((friendly.x+hostile.x)/2,(friendly.y+hostile.y)/2,'#6ff7ff',10);
    sound(620,.055,'triangle',.018);
    intercepted=true;
    break;
   }
  }
  if(intercepted) continue;
 }
 enemies.forEach(e=>{
  e.y+=e.speed*dt;e.x+=Math.sin(elapsed*1.7+e.phase)*e.vx*dt;
  e.fire-=dt;if(e.fire<=0&&e.y>0&&e.y<H*.65){enemyBullets.push({x:e.x,y:e.y+e.h*.35,vx:(player.x-e.x)*.14,vy:190+elapsed*.6,r:4});e.fire=rand(2.1,4.2)}
 });
 for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];
  if(e.y>H+35){enemies.splice(i,1);continue}
  for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(Math.abs(b.x-e.x)<e.w*.48&&Math.abs(b.y-e.y)<e.h*.48){e.hp-=b.damage;bullets.splice(j,1);addExplosion(b.x,b.y,'#5cecff',3);if(e.hp<=0){score+=e.big?80:25;ui.score.textContent=score;addExplosion(e.x,e.y,e.big?'#ff9d4d':'#ff597b',e.big?32:18);sound(e.big?180:240,.11,'sawtooth',.035);if(Math.random()<.12)powerups.push({x:e.x,y:e.y,vy:95,r:10,type:Math.random()<.5?'heart':'power'});enemies.splice(i,1)}break}}
 }
 powerups.forEach(p=>p.y+=p.vy*dt);
 for(let i=powerups.length-1;i>=0;i--){let p=powerups[i];if(Math.abs(p.x-player.x)<25&&Math.abs(p.y-player.y)<35){if(p.type==='heart'){lives=Math.min(5,lives+1);ui.lives.textContent=lives;notify('VIE BONUS')}else{power=9;player.weapon=Math.min(3,player.weapon+1);notify('TIR AMÉLIORÉ')}sound(900,.16,'sine');powerups.splice(i,1)}else if(p.y>H+20)powerups.splice(i,1)}
 if(player.invuln<=0){
  for(let i=enemyBullets.length-1;i>=0;i--){let b=enemyBullets[i];if(Math.abs(b.x-player.x)<player.w*.42&&Math.abs(b.y-player.y)<player.h*.42){enemyBullets.splice(i,1);hitPlayer();break}}
  if(player.invuln<=0){for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(Math.abs(e.x-player.x)<(e.w+player.w)*.36&&Math.abs(e.y-player.y)<(e.h+player.h)*.36){enemies.splice(i,1);addExplosion(e.x,e.y,'#ff8b54',18);hitPlayer();break}}}
 }
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.08,dt);p.vy*=Math.pow(.08,dt);p.life-=dt});particles=particles.filter(p=>p.life>0);
 shake=Math.max(0,shake-dt*20);
}
function hitPlayer(){lives--;ui.lives.textContent=lives;player.invuln=1.5;shake=9;addExplosion(player.x,player.y,'#ff5577',25);sound(100,.22,'sawtooth',.06);if(lives<=0)endGame()}
function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080d25');g.addColorStop(.52,'#10113a');g.addColorStop(1,'#090b25');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant nebulae
 for(let i=0;i<3;i++){let x=W*(.16+i*.37)+Math.sin(elapsed*.12+i)*20,y=H*(.25+i*.22);let rg=ctx.createRadialGradient(x,y,1,x,y,W*.34);rg.addColorStop(0,i===1?'rgba(110,42,205,.18)':'rgba(27,126,220,.13)');rg.addColorStop(1,'rgba(20,30,100,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H)}
 // planet
 const px=W*.84,py=H*.57,pr=Math.min(W*.085,34);const pg=ctx.createRadialGradient(px-pr*.35,py-pr*.4,1,px,py,pr*1.2);pg.addColorStop(0,'#8d8df7');pg.addColorStop(.5,'#373d98');pg.addColorStop(1,'#10142e');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9e9cff66';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(px,py,pr*1.3,pr*.42,-.35,0,Math.PI*2);ctx.stroke();
 stars.forEach(s=>{const a=.35+.55*(.5+.5*Math.sin(s.tw*2));ctx.globalAlpha=a;ctx.fillStyle=s.z>.8?'#dffbff':'#8ca8ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r*s.z,0,Math.PI*2);ctx.fill();if(s.z>.9){ctx.fillRect(s.x-3,s.y,.6,5);ctx.fillRect(s.x,s.y-3,5,.6)}});ctx.globalAlpha=1;
}
function drawPlayer(){
 if(player.invuln>0&&Math.floor(elapsed*13)%2===0)return;
 ctx.save();ctx.translate(player.x,player.y);
 // exhaust
 for(let i=-1;i<=1;i++){const flame=rand(16,27);let fg=ctx.createLinearGradient(0,24,0,24+flame);fg.addColorStop(0,'#fff8a5');fg.addColorStop(.35,'#ff8b35');fg.addColorStop(1,'rgba(255,50,75,0)');ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(i*12-4,22);ctx.lineTo(i*12,22+flame);ctx.lineTo(i*12+4,22);ctx.closePath();ctx.fill()}
 const body=ctx.createLinearGradient(-20,-28,20,28);body.addColorStop(0,'#f8ffff');body.addColorStop(.4,'#9beeff');body.addColorStop(.7,'#6478e8');body.addColorStop(1,'#e6f9ff');
 ctx.fillStyle=body;ctx.strokeStyle='#f1ffff';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-31);ctx.lineTo(10,-5);ctx.lineTo(25,14);ctx.lineTo(24,22);ctx.lineTo(12,18);ctx.lineTo(7,10);ctx.lineTo(5,27);ctx.lineTo(0,31);ctx.lineTo(-5,27);ctx.lineTo(-7,10);ctx.lineTo(-12,18);ctx.lineTo(-24,22);ctx.lineTo(-25,14);ctx.lineTo(-10,-5);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#e33e62';ctx.beginPath();ctx.moveTo(-17,13);ctx.lineTo(-24,19);ctx.lineTo(-13,17);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(17,13);ctx.lineTo(24,19);ctx.lineTo(13,17);ctx.closePath();ctx.fill();
 ctx.fillStyle='#163f89';ctx.beginPath();ctx.ellipse(0,-9,5.3,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#63f5ff';ctx.beginPath();ctx.ellipse(0,-10,2.3,6,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f04a5f';ctx.fillRect(-3,12,6,6);
 ctx.restore();
}
function drawEnemy(e){
 ctx.save();ctx.translate(e.x,e.y);
 const colors=[['#d8e7ff','#4d79bb','#ff665c'],['#d8e3cf','#7a8b66','#ffad4e'],['#e6d6ff','#8655ad','#ff4d91']][e.kind];
 ctx.fillStyle=colors[1];ctx.strokeStyle=colors[0];ctx.lineWidth=1.2;
 ctx.beginPath();ctx.moveTo(0,-e.h*.48);ctx.lineTo(e.w*.27,-e.h*.08);ctx.lineTo(e.w*.5,e.h*.22);ctx.lineTo(e.w*.3,e.h*.32);ctx.lineTo(e.w*.12,e.h*.16);ctx.lineTo(0,e.h*.43);ctx.lineTo(-e.w*.12,e.h*.16);ctx.lineTo(-e.w*.3,e.h*.32);ctx.lineTo(-e.w*.5,e.h*.22);ctx.lineTo(-e.w*.27,-e.h*.08);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle=colors[2];ctx.fillRect(-e.w*.25,-2,e.w*.5,4);
 ctx.fillStyle='#65eaff';ctx.beginPath();ctx.ellipse(0,-e.h*.13,e.w*.12,e.h*.14,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#ffb35a';ctx.fillRect(-e.w*.23,e.h*.27,4,rand(5,11));ctx.fillRect(e.w*.12,e.h*.27,4,rand(5,11));
 if(e.big){ctx.strokeStyle='#ffbd62';ctx.strokeRect(-e.w*.52,-e.h*.58,e.w*1.04+2,e.h*1.16);ctx.fillStyle='#ffce5c';ctx.fillRect(-e.w*.5,-e.h*.72,e.w*(e.hp/e.maxHp),2)}
 ctx.restore();
}
function draw(){
 ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
 drawBackground();
 bullets.forEach(b=>{const g=ctx.createLinearGradient(b.x,b.y+18,b.x,b.y-12);g.addColorStop(0,'rgba(46,120,255,0)');g.addColorStop(.55,'#38baff');g.addColorStop(1,'#e7ffff');ctx.fillStyle=g;ctx.shadowBlur=12;ctx.shadowColor='#28dfff';ctx.fillRect(b.x-b.r,b.y-14,b.r*2,28);ctx.shadowBlur=0});
 enemyBullets.forEach(b=>{ctx.fillStyle='#ff754f';ctx.shadowBlur=12;ctx.shadowColor='#ff4b58';ctx.beginPath();ctx.ellipse(b.x,b.y,3.2,7,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
 enemies.forEach(drawEnemy);
 powerups.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.shadowBlur=15;ctx.shadowColor=p.type==='heart'?'#ff4776':'#48f2ff';ctx.fillStyle=p.type==='heart'?'#ff547b':'#49efff';ctx.beginPath();ctx.arc(0,0,p.r+2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#09142e';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.type==='heart'?'+':'⚡',0,1);ctx.restore()});
 particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowBlur=9;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*clamp(p.life/p.max,.25,1),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.shadowBlur=0;
 drawPlayer();
  if(megaFlash>0){ctx.save();ctx.globalAlpha=megaFlash/.42;const beam=ctx.createLinearGradient(0,0,0,H);beam.addColorStop(0,'rgba(96,248,255,0)');beam.addColorStop(.5,'rgba(96,248,255,.9)');beam.addColorStop(1,'rgba(96,248,255,0)');ctx.fillStyle=beam;ctx.fillRect(player.x-28,0,56,H);ctx.restore()}
  ctx.restore();
}
function loop(now){if(!running||paused)return;const dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw();if(running&&!paused)requestAnimationFrame(loop)}
function moveTo(e){const rect=canvas.getBoundingClientRect();pointerX=clamp(e.clientX-rect.left,25,W-25)}
canvas.addEventListener('pointerdown',e=>{pointerDown=true;moveTo(e);canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(pointerDown)moveTo(e)});
canvas.addEventListener('pointerup',()=>{pointerDown=false;pointerX=null});
canvas.addEventListener('pointercancel',()=>{pointerDown=false;pointerX=null});
function bindHold(id,key){const el=$(id);const on=e=>{e.preventDefault();keys[key]=true};const off=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off)}
bindHold('leftBtn','left');bindHold('rightBtn','right');
$('fireBtn').addEventListener('pointerdown',e=>{e.preventDefault();useMegaWeapon()});
$('startBtn').onclick=resetGame;$('againBtn').onclick=resetGame;$('restartBtn').onclick=resetGame;
$('pauseBtn').onclick=()=>paused?resumeGame():pauseGame();$('resumeBtn').onclick=resumeGame;
$('homeBtn').onclick=()=>{running=false;endTrackedSession();paused=false;ui.over.classList.add('hidden');ui.menu.classList.remove('hidden')};
$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent='SON : '+(soundOn?'ACTIVÉ':'DÉSACTIVÉ');if(soundOn)sound(700,.08)};
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '){keys.fire=true;fireTimer=0}if(e.key==='Escape')paused?resumeGame():pauseGame()});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});
draw();updateMegaButton();loadAdvertisement();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
})();
</script>
